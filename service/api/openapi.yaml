openapi: 3.1.0
info:
  title: Fire API
  version: 1.0.0
  description: |
    The HTTP API behind the Fire web app. Each route combines App Store Connect
    resources into the shape one screen needs.

    Authentication: send a signed App Store Connect JWT in `X-App-Store-Token`,
    or run Fire with a server key (see the backend README). Browser requests must
    come from Fire's own origin or an origin listed in `FIRE_ALLOWED_ORIGINS`.

    Request bodies are JSON (`Content-Type: application/json`); unknown fields
    are rejected. Every error has the `Error` shape.
servers:
  - url: /api/v1
security:
  - browserToken: []
  - {}

components:
  securitySchemes:
    browserToken:
      type: apiKey
      in: header
      name: X-App-Store-Token
      description: An ES256 App Store Connect token, valid for at most 20 minutes.
  parameters:
    app:
      name: app
      in: path
      required: true
      description: The app's Apple ID.
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    kind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [subscription, iap] }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                One of invalid_request, no_credentials, origin_denied, not_found,
                apple_authentication, apple_permission, apple_rate_limit,
                apple_timeout, apple_unavailable, apple_rejected, network.
            message: { type: string }
    Document:
      type: object
      description: A screen document. Field names match web/src/lib/types.ts.
      additionalProperties: true
    LocalizationInput:
      type: object
      properties:
        locale: { type: string, example: ja }
        name: { type: string, maxLength: 30 }
        description: { type: string, maxLength: 45 }
  responses:
    Doc:
      description: The updated or requested document.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }
    Error:
      description: An error from Fire or App Store Connect.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        "200": { description: OK }
  /session:
    get:
      summary: Server key and version
      description: "`serverKey` is null unless the server has its own key. Never returns key material."
      security: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverKey:
                    type: [object, "null"]
                    properties:
                      keyId: { type: string }
                      issuerId: { type: string }
                      keyType: { type: string, enum: [team, individual] }
                  version: { type: string }

  /apps:
    get:
      summary: Apps the key can see
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /apps/{app}/overview:
    get:
      summary: Dashboard
      description: Versions, recent builds, recent review submissions and localization completeness.
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /apps/{app}/metadata:
    parameters: [{ $ref: "#/components/parameters/app" }]
    get:
      summary: Metadata for one version
      parameters:
        - { name: version, in: query, schema: { type: string }, description: An App Store version ID. Defaults to the newest. }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    patch:
      summary: Save metadata changes
      description: Only the fields sent are changed. A null value clears a field. Returns the refreshed metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                versionId: { type: string }
                appInfoId: { type: string }
                locales:
                  type: array
                  items:
                    type: object
                    properties:
                      locale: { type: string }
                      appInfoLocalizationId: { type: string }
                      versionLocalizationId: { type: string }
                      fields:
                        type: object
                        description: |
                          name and subtitle (30), privacyPolicyUrl, privacyChoicesUrl,
                          description (4000), keywords (100), promotionalText (170),
                          whatsNew (4000), supportUrl, marketingUrl.
                        additionalProperties: { type: [string, "null"] }
                version:
                  type: object
                  description: copyright, releaseType (MANUAL, AFTER_APPROVAL, SCHEDULED), earliestReleaseDate.
                  additionalProperties: { type: [string, "null"] }
                categories:
                  type: object
                  description: primaryCategory and secondaryCategory IDs.
                  additionalProperties: { type: [string, "null"] }
                reviewDetail:
                  type: object
                  description: Contact fields, demoAccountRequired, demoAccountName, demoAccountPassword, notes.
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /apps/{app}/metadata/locales:
    post:
      summary: Add a language to a version
      description: The new localization starts with the primary language's text.
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId, locale]
              properties:
                versionId: { type: string }
                locale: { type: string, example: zh-Hant }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /localizations/{id}/screenshots:
    get:
      summary: Screenshot sets for a version localization
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /apps/{app}/reviews:
    parameters: [{ $ref: "#/components/parameters/app" }]
    get:
      summary: App Review submissions
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    post:
      summary: Submit a version for App Review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId: { type: string }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /apps/{app}/reviews/{id}/cancel:
    post:
      summary: Cancel a review submission
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /apps/{app}/builds:
    get:
      summary: Builds, beta groups and tester count
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: platform, in: query, schema: { type: string, enum: [IOS, MAC_OS, TV_OS, VISION_OS], default: IOS } }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /apps/{app}/testers:
    post:
      summary: Invite a TestFlight tester to beta groups
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, groupIds]
              properties:
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                groupIds: { type: array, items: { type: string } }
      responses: { "200": { description: Invited }, default: { $ref: "#/components/responses/Error" } }
  /builds/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: Build detail, groups, usage and tester feedback
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    patch:
      summary: Save What to Test, or expire the build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                whatToTest: { type: string, maxLength: 4000 }
                expire: { type: boolean }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /builds/{id}/groups/{group}:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: group, in: path, required: true, schema: { type: string } }
    put:
      summary: Add the build to a beta group
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    delete:
      summary: Remove the build from a beta group
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /builds/{id}/beta-review:
    post:
      summary: Submit the build for Beta App Review
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /apps/{app}/purchases:
    get:
      summary: Subscription groups and in-app purchases
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /purchases/{kind}/{id}:
    parameters: [{ $ref: "#/components/parameters/kind" }, { $ref: "#/components/parameters/id" }]
    get:
      summary: Product detail with localizations and prices in key territories
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    patch:
      summary: Save the review note or Family Sharing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewNote: { type: string, maxLength: 4000 }
                familySharable: { type: boolean }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /purchases/{kind}/{id}/localizations:
    post:
      summary: Add a product localization
      parameters: [{ $ref: "#/components/parameters/kind" }, { $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalizationInput" }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /purchases/{kind}/{id}/localizations/{loc}:
    parameters:
      - { $ref: "#/components/parameters/kind" }
      - { $ref: "#/components/parameters/id" }
      - { name: loc, in: path, required: true, schema: { type: string }, description: The localization ID. }
    patch:
      summary: Update a product localization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalizationInput" }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
    delete:
      summary: Delete a product localization
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /apps/{app}/sales:
    get:
      summary: Daily sales for the app and its in-app purchases
      description: |
        Built from daily Sales and Trends SUMMARY reports. Days Apple hasn't
        published yet come back with `available: false`. Proceeds are grouped by
        the currency Apple pays in and rounded to cents.
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: vendor, in: query, required: true, schema: { type: string, pattern: "^[0-9]{6,12}$" } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, description: At most 92 days after from. }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }

  /team:
    get:
      summary: Users and pending invitations
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /team/invitations:
    post:
      summary: Invite a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, roles]
              properties:
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [ADMIN, APP_MANAGER, DEVELOPER, MARKETING, SALES, FINANCE, ACCESS_TO_REPORTS, CUSTOMER_SUPPORT, CREATE_APPS] }
                allAppsVisible: { type: boolean }
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /team/invitations/{id}:
    delete:
      summary: Cancel an invitation
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
  /team/users/{id}:
    delete:
      summary: Remove a user
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses: { "200": { $ref: "#/components/responses/Doc" }, default: { $ref: "#/components/responses/Error" } }
